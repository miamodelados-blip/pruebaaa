<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORINA VILLANUEVA | Freelance Portfolio</title>
    <!-- Google Fonts / Tipografías Geométricas de apoyo -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@450;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FFE083;          /* Amarillo pálido - fondo principal */
            --surface-color: #C1A2E3;     /* Morado claro - bloques de contenido */
            --text-primary: #796193;      /* Morado oscuro - textos y logotipos */
            --accent-yellow: #FFC926;     /* Amarillo vibrante - detalles, sol, CTA */
            --border-color: rgba(121, 97, 147, 0.2);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: var(--text-primary);
            color: var(--bg-color);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 450;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Patrón de puntos morados sobre amarillo pálido (Hero) */
        .dotted-bg-purple {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--text-primary) 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        /* Patrón de puntos morados pequeños (Moodboard izq) */
        .dotted-box-purple {
            background-color: var(--surface-color);
            background-image: radial-gradient(var(--text-primary) 1px, transparent 1px);
            background-size: 14px 14px;
        }

        /* Patrón de puntos amarillos pequeños (Moodboard der) */
        .dotted-box-yellow {
            background-color: var(--surface-color);
            background-image: radial-gradient(var(--accent-yellow) 1.2px, transparent 1.2px);
            background-size: 14px 14px;
        }

        /* Layout & Navigation Base */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(255, 224, 131, 0.88);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-nav {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .btn-cta {
            background-color: var(--text-primary);
            color: var(--bg-color);
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            transition: var(--transition);
            display: inline-block;
        }

        .btn-cta:hover {
            background-color: var(--accent-yellow);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* Hero / Logotipo Principal Section */
        .hero-section {
            min-height: 90vh;
            padding: 9rem 5% 5rem 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .main-logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .flower-icon {
            color: var(--accent-yellow);
            font-size: 3.5rem;
            display: block;
            margin: 0 auto -0.8rem auto;
            filter: drop-shadow(0 2px 4px rgba(121, 97, 147, 0.15));
        }

        .main-logo-title {
            font-family: Georgia, 'Times New Roman', serif; /* Simula cursiva audaz/ornamentada estilo TT Hazelnuts */
            font-style: italic;
            font-weight: 700;
            font-size: clamp(4rem, 10vw, 7.5rem);
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .sub-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 0.5rem;
        }

        /* Área de Llamada a la Acción (CTA) en dos columnas inferiores */
        .cta-split-section {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        .cta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 480px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(121, 97, 147, 0.12);
        }

        /* Columna Izquierda (Amarillo vibrante / CTA) */
        .cta-col-left {
            background-color: var(--accent-yellow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        /* Columna Derecha (Morado claro) */
        .cta-col-right {
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        /* Logotipos circulares secundarios simulados con CSS SVG/Rotación de texto */
        .badge-circle-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .badge-center-c {
            font-family: Georgia, serif;
            font-size: 5.5rem;
            font-style: italic;
            font-weight: bold;
            color: var(--text-primary);
            line-height: 0;
            z-index: 2;
        }

        .badge-circle-right .badge-center-c {
            color: var(--bg-color);
        }

        .rotating-text-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateBadge 18s linear infinite;
        }

        .rotating-text-svg text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            fill: var(--text-primary);
        }

        .badge-circle-right .rotating-text-svg text {
            fill: var(--text-primary);
        }

        @keyframes rotateBadge {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .badge-label-action {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        /* Gráficos de Soporte (Sección 'Moodboard') */
        .moodboard-section {
            max-width: 1300px;
            margin: 6rem auto 4rem auto;
            padding: 0 5%;
        }

        .moodboard-header {
            text-align: center;
            margin-bottom: 3rem;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-primary);
            font-weight: 700;
        }

        .moodboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 2rem;
            align-items: stretch;
            min-height: 240px;
        }

        .moodboard-card {
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
        }

        /* Gran sol amarillo estilizado en el centro */
        .giant-sun-container {
            background-color: var(--surface-color);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .giant-sun {
            width: 100%;
            height: 180px;
            color: var(--accent-yellow);
        }

        /* Footer */
        footer {
            padding: 3rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-primary);
            font-weight: 600;
            max-width: 1300px;
            margin: 0 auto;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-socials {
            display: flex;
            gap: 1.5rem;
        }

        .footer-socials a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .footer-socials a:hover {
            opacity: 0.6;
        }

        /* Responsive */
        @media(max-width: 900px) {
            .mobile-menu-toggle {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 73px;
                left: 0;
                width: 100%;
                background: var(--bg-color);
                flex-direction: column;
                padding: 2rem 0;
                border-bottom: 1px solid var(--border-color);
                transform: translateY(-150%);
                opacity: 0;
                transition: var(--transition);
                pointer-events: none;
            }

            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            .cta-grid {
                grid-template-columns: 1fr;
            }

            .moodboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="dotted-bg-purple">

    <!-- Header -->
    <header>
        <a href="#" class="logo-nav">Corina V.</a>
        <button class="mobile-menu-toggle" aria-label="Abrir menú" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="#hero" class="nav-close">Inicio</a></li>
            <li><a href="#cta-area" class="nav-close">Servicios</a></li>
            <li><a href="#moodboard" class="nav-close">Moodboard</a></li>
            <li><a href="#cta-area" class="btn-cta nav-close">Contacto</a></li>
        </ul>
    </header>

    <!-- Hero Section / Logotipo Principal -->
    <section id="hero" class="hero-section">
        <div class="main-logo-container">
            <i class="fa-solid fa-sun flower-icon"></i>
            <h1 class="main-logo-title">corina</h1>
        </div>
        <div class="sub-subtitle">CORINA VILLANUEVA</div>
    </section>

    <!-- Área de Llamada a la Acción (CTA) - 2 Columnas -->
    <section id="cta-area" class="cta-split-section">
        <div class="cta-grid">
            <!-- Columna Izquierda (Amarillo) -->
            <div class="cta-col-left">
                <span class="badge-label-action">Proyectos Creativos</span>
                <div class="badge-circle-wrapper">
                    <span class="badge-center-c">C</span>
                    <svg class="rotating-text-svg" viewBox="0 0 200 200">
                        <path id="circlePath1" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="transparent"/>
                        <text><textPath href="#circlePath1" startOffset="0%">CORINA VILLANUEVA • CORINA VILLANUEVA • </textPath></text>
                    </svg>
                </div>
                <a href="mailto:hola@corinavillanueva.com" class="btn-cta">Hablemos</a>
            </div>

            <!-- Columna Derecha (Morado Claro) -->
            <div class="cta-col-right" style="color: var(--text-primary);">
                <span class="badge-label-action" style="color: var(--text-primary);">Disponibilidad</span>
                <div class="badge-circle-wrapper badge-circle-right">
                    <span class="badge-center-c">C</span>
                    <svg class="rotating-text-svg" viewBox="0 0 200 200">
                        <path id="circlePath2" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="transparent"/>
                        <text><textPath href="#circlePath2" startOffset="0%">CORINA VILLANUEVA • FREELANCER • </textPath></text>
                    </svg>
                </div>
                <a href="mailto:hola@corinavillanueva.com" class="btn-cta" style="background-color: var(--text-primary); color: var(--bg-color);">Colaboremos</a>
            </div>
        </div>
    </section>

    <!-- Gráficos de Soporte (Sección 'Moodboard') -->
    <section id="moodboard" class="moodboard-section">
        <div class="moodboard-header">MOODBOARD</div>
        <div class="moodboard-grid">
            <!-- Patrón de puntos morados pequeños a la izquierda -->
            <div class="moodboard-card dotted-box-purple"></div>

            <!-- Gran sol amarillo estilizado en el centro -->
            <div class="moodboard-card giant-sun-container">
                <svg class="giant-sun" viewBox="0 0 500 250" preserveAspectRatio="none">
                    <path d="M 250, 250 L 15, 250 L 70, 115 Z" fill="#FFC926"/>
                    <path d="M 250, 250 L 115, 250 L 140, 70 Z" fill="#FFC926"/>
                    <path d="M 250, 250 L 210, 250 L 220, 20 Z" fill="#FFC926"/>
                    <path d="M 250, 250 L 290, 250 L 280, 20 Z" fill="#FFC926"/>
                    <path d="M 250, 250 L 385, 250 L 360, 70 Z" fill="#FFC926"/>
                    <path d="M 250, 250 L 485, 250 L 430, 115 Z" fill="#FFC926"/>
                    <path d="M 0, 250 L 500, 250 L 500, 230 L 0, 230 Z" fill="#FFC926"/>
                </svg>
            </div>

            <!-- Patrón de puntos amarillos pequeños a la derecha -->
            <div class="moodboard-card dotted-box-yellow"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div>© 2026 CORINA VILLANUEVA. All rights reserved.</div>
        <div class="footer-socials">
            <a href="https://instagram.com" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://behance.net" target="_blank" rel="noopener"><i class="fa-brands fa-behance"></i></a>
            <a href="mailto:hola@corinavillanueva.com"><i class="fa-regular fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        const toggle = document.getElementById('menuToggle');
        const nav = document.getElementById('navLinks');
        const links = document.querySelectorAll('.nav-close');
        const icon = toggle.querySelector('i');

        toggle.addEventListener('click', () => {
            nav.classList.toggle('active');
            const isOpen = nav.classList.contains('active');
            icon.className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
        });

        links.forEach(link => {
            link.addEventListener('click', () => {
                nav.classList.remove('active');
                icon.className = 'fa-solid fa-bars';
            });
        });
    </script>
</body>
</html>
